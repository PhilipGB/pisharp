name: Linux CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --requirement tools/parity/requirements-images.txt
      - run: npm ci --prefix tools/parity/terminal --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix tools/parity/terminal
      - run: python3 -m unittest discover -s tools/parity/terminal -p 'test_*.py'
      - run: python3 -m unittest discover -s tools/parity -p 'test_builtin_coding_tool_differential.py'
      - run: python3 tools/validate_doc_paths.py
      - run: dotnet restore PiSharp.slnx
      - run: dotnet format PiSharp.slnx --verify-no-changes --no-restore
      - run: dotnet build PiSharp.slnx --no-restore --warnaserror
      - run: dotnet test PiSharp.slnx --no-build --no-restore
  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: dotnet restore PiSharp.slnx
      - run: dotnet build tools/McpConformance/PiSharp.McpConformance.csproj --no-restore --warnaserror
      - run: node tools/parity/mcp-conformance/run.mjs
