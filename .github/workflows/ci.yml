name: Linux CI
on:
  push:
  pull_request:
jobs:
  macos-session-locks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/PiSharp.Tests/PiSharp.Tests.csproj
      - name: Verify native macOS session leases
        run: >-
          dotnet test tests/PiSharp.Tests/PiSharp.Tests.csproj --no-restore
          --filter 'FullyQualifiedName~ConcurrentSessionLeasesInOneProcessWaitForTheCurrentWriter|FullyQualifiedName~ConcurrentSessionLeaseAliasesWaitForTheCurrentWriter|FullyQualifiedName~CancelledStoreSaveWaitingForLeaseKeepsPersistedSnapshotAndCleansNoTempFiles|FullyQualifiedName~ConcurrentProcessSaveWaitsForTheSessionLeaseAndPersistsTheToolOutcome'
  macos-clipboard-contracts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/PiSharp.Tests/PiSharp.Tests.csproj
      - name: Verify macOS AppleScript and clipboard contracts
        run: dotnet test tests/PiSharp.Tests/PiSharp.Tests.csproj --no-restore --filter FullyQualifiedName~TerminalClipboardTests
  windows-clipboard-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/PiSharp.Tests/PiSharp.Tests.csproj
      - name: Verify Windows clipboard script and cleanup contracts
        run: dotnet test tests/PiSharp.Tests/PiSharp.Tests.csproj --no-restore --filter FullyQualifiedName~TerminalClipboardTests
  managed-package-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify managed-package evidence controls
        run: python3 tools/parity/managed_packages/test_verifier.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install the validated fd build
        run: |
          mkdir -p "$RUNNER_TEMP/pisharp-search-bin"
          curl --fail --location --silent --show-error --retry 3 --output "$RUNNER_TEMP/fd.tar.gz" https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-unknown-linux-musl.tar.gz
          echo "761c72dc8e120d85b22292063be8a796e2eeb20eb3e4f38b8fa2343ccf3514a7  $RUNNER_TEMP/fd.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/fd.tar.gz" --directory "$RUNNER_TEMP/pisharp-search-bin" --strip-components=1 fd-v10.5.0-x86_64-unknown-linux-musl/fd
          echo "$RUNNER_TEMP/pisharp-search-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pisharp-search-bin/fd" --version
          rg --version
      - run: python3 -m pip install --requirement tools/parity/requirements-images.txt
      - run: npm ci --prefix tools/parity/terminal --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix tools/parity/terminal
      - run: python3 -m unittest discover -s tools/parity/terminal -p 'test_*.py'
      - run: python3 -m unittest discover -s tools/parity -p 'test_builtin_coding_tool_differential.py'
      - run: python3 tools/validate_doc_paths.py
      - run: dotnet restore PiSharp.slnx
      - run: dotnet format PiSharp.slnx --verify-no-changes --no-restore
      - run: dotnet build PiSharp.slnx --no-restore --warnaserror
      - uses: actions/checkout@v4
        with:
          repository: earendil-works/pi
          ref: b06c1f2cf1dea6af8748ddeee18c23587d2cb7c6
          path: artifacts/parity/pi-ownership-oracle
          persist-credentials: false
          clean: false
      - run: npm ci --prefix artifacts/parity/pi-ownership-oracle --ignore-scripts --no-audit --no-fund
      - name: Run pinned multimodal image and session differentials
        run: |
          mkdir -p artifacts/parity/multimodal-differential
          python3 tools/parity/multimodal-image-differential.py --pi artifacts/parity/pi-ownership-oracle --output artifacts/parity/multimodal-differential/image-processing.json
          python3 tools/parity/multimodal-file-argument-differential.py --pi artifacts/parity/pi-ownership-oracle --output artifacts/parity/multimodal-differential/file-arguments.json
          python3 tools/parity/multimodal-file-recovery-differential.py --pi artifacts/parity/pi-ownership-oracle --output artifacts/parity/multimodal-differential/file-recovery.json
          python3 tools/parity/multimodal-provider-wire-differential.py --pi artifacts/parity/pi-ownership-oracle --output artifacts/parity/multimodal-differential/provider-wire.json
          python3 tools/parity/multimodal-session-continuation-differential.py --pi artifacts/parity/pi-ownership-oracle --output artifacts/parity/multimodal-differential/session-continuation.json
          python3 tools/parity/multimodal-session-wire-differential.py --pi artifacts/parity/pi-ownership-oracle --output artifacts/parity/multimodal-differential/session-provider-wire.json
          python3 tools/parity/multimodal-clipboard-differential.py --pi artifacts/parity/pi-ownership-oracle --output artifacts/parity/multimodal-differential/clipboard.json
          python3 tools/parity/multimodal-protocol-image-differential.py --pi artifacts/parity/pi-ownership-oracle --output artifacts/parity/multimodal-differential/protocol-images.json
      - run: |
          mkdir -p artifacts/parity/builtin-ownership
          PI_OFFLINE=1 node tools/parity/builtin-coding-tool-probe.mjs artifacts/parity/pi-ownership-oracle /dev/null artifacts/parity/builtin-ownership/pinned.json --mutation-ownership-only
      - run: dotnet test PiSharp.slnx --no-build --no-restore
        env:
          PISHARP_TEST_OWNERSHIP_ORACLE: ${{ github.workspace }}/artifacts/parity/builtin-ownership/pinned.json
      - name: Verify push and pull request merge identity
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test -n "$PULL_REQUEST_HEAD_SHA"
            test -n "$PULL_REQUEST_BASE_SHA"
            git merge-base --is-ancestor "$PULL_REQUEST_HEAD_SHA" "$GITHUB_SHA"
            git merge-base --is-ancestor "$PULL_REQUEST_BASE_SHA" "$GITHUB_SHA"
          else
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
      - name: Run managed-package parity corpus
        run: >-
          python3 tools/parity/managed_packages/verify.py execute --all
          --pi artifacts/parity/pi-ownership-oracle
          --output artifacts/parity/managed-packages
      - name: Record managed-package CI integration
        run: >-
          python3 tools/parity/managed_packages/verify.py execute
          --checkpoint ci-integration --pi artifacts/parity/pi-ownership-oracle
          --output artifacts/parity/managed-packages
      - name: Independently check managed-package evidence
        env:
          PISHARP_MANAGED_CI_SCOPE: local
        run: python3 tools/parity/managed_packages/verify.py check --all --evidence artifacts/parity/managed-packages
      - name: Upload managed-package parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-package-parity
          path: |
            artifacts/parity/managed-packages
            !artifacts/parity/managed-packages/profile/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: builtin-ownership-${{ github.event_name }}
          path: artifacts/parity/builtin-ownership/pinned.json
  mcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: dotnet restore PiSharp.slnx
      - run: dotnet build tools/McpConformance/PiSharp.McpConformance.csproj --no-restore --warnaserror
      - run: node tools/parity/mcp-conformance/run.mjs
